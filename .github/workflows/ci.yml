name: Data Agent CI

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

env:
  MO_HOST: ${{ secrets.MO_HOST }}
  MO_PORT: ${{ secrets.MO_PORT }}
  MO_USER: ${{ secrets.MO_USER }}
  MO_PASSWORD: ${{ secrets.MO_PASSWORD }}
  MO_DATABASE: ${{ secrets.MO_DATABASE }}
  MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
  MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify imports
        run: |
          python -c "
          from data_agent.main import app
          from data_agent.config import settings
          from data_agent.storage.database import init_database
          from data_agent.ingestion.excel_loader import load_excel, load_csv
          from data_agent.router.query_router import route
          from data_agent.skills.sql_skill import execute
          routes = [r.path for r in app.routes]
          print('Routes:', routes)
          print('All imports OK')
          "

      - name: Test MatrixOne connectivity
        run: |
          python -c "
          from data_agent.storage.database import init_database, execute_query
          init_database()
          rows = execute_query('SELECT 1 AS ok')
          assert rows == [{'ok': 1}], f'Unexpected: {rows}'
          print('MatrixOne connected OK')
          "

      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: "http://localhost:8000"
        run: npm run build

      - name: Start backend and run full smoke test
        run: |
          # Start backend
          uvicorn data_agent.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!

          # Wait for backend
          for i in $(seq 1 15); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done

          # Health check
          echo "=== Health Check ==="
          curl -s http://localhost:8000/health | python -m json.tool

          # List data sources
          echo "=== List Data Sources ==="
          curl -s http://localhost:8000/api/datasources | python -m json.tool

          # Upload a test CSV
          echo "=== Upload Test CSV ==="
          echo 'product,region,amount,date
          Widget A,North,1500.50,2025-01-15
          Widget B,South,2300.00,2025-01-20
          Widget A,South,1800.75,2025-02-10
          Widget C,North,950.25,2025-02-15
          Widget B,North,3100.00,2025-03-01' > /tmp/test_sales.csv

          UPLOAD_RESULT=$(curl -s -X POST http://localhost:8000/api/datasources/upload \
            -F "file=@/tmp/test_sales.csv")
          echo "$UPLOAD_RESULT" | python -m json.tool

          SOURCE_ID=$(echo "$UPLOAD_RESULT" | python -c "import sys,json; print(json.load(sys.stdin)['source_id'])")
          echo "Source ID: $SOURCE_ID"

          # Check data source detail
          echo "=== Data Source Detail ==="
          curl -s "http://localhost:8000/api/datasources/$SOURCE_ID" | python -m json.tool

          # Ask a question
          echo "=== Chat Query ==="
          CHAT_RESULT=$(curl -s -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"question": "哪个产品的总销售额最高？"}')
          echo "$CHAT_RESULT" | python -m json.tool

          # Verify frontend build output exists
          echo "=== Verify Frontend Build ==="
          ls -la frontend/dist/index.html
          echo "Frontend build OK"

          # Cleanup
          echo "=== Cleanup ==="
          curl -s -X DELETE "http://localhost:8000/api/datasources/$SOURCE_ID" | python -m json.tool

          kill $SERVER_PID 2>/dev/null || true
          echo "=== Integration test complete ==="
